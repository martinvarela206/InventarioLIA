version: '3.8'

services:
  # ==============================================================================
  # CONTENEDOR 1: APLICACIÓN LARAVEL (PHP 8.2 + Apache + Vite Assets)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventario-lia-app:latest
    container_name: laravel_prod
    restart: always
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-inventario_lia}
      - DB_USERNAME=${DB_USERNAME:-inventario_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret_password}
    volumes:
      # Persistencia de uploads (fotos de personal, espacios físicos, tickets y adjuntos)
      - storage_uploads:/var/www/html/storage/app/public
    networks:
      - app_network

  # ==============================================================================
  # CONTENEDOR 2: BASE DE DATOS MARIADB 11.4 LTS
  # ==============================================================================
  db:
    image: mariadb:11.4
    container_name: mariadb_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-inventario_lia}
      MYSQL_USER: ${DB_USERNAME:-inventario_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      # Persistencia de los datos de MariaDB
      - mariadb_data:/var/lib/mysql
      - mariadb_audit_logs:/var/log/mysql
    command:
      - 'mariadbd'
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
      - '--plugin-load-add=server_audit'
      - '--server-audit=FORCE_PLUS_PERMANENT'
      - '--server-audit-logging=ON'
      - '--server-audit-events=CONNECT,QUERY_DML,QUERY_DDL'
      - '--server-audit-output-type=FILE'
      - '--server-audit-file-path=/var/log/mysql/audit.log'
      - '--server-audit-file-rotate-size=104857600'
      - '--server-audit-file-rotations=5'
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

# Red interna privada entre la aplicación y el motor de base de datos
networks:
  app_network:
    driver: bridge

# Volúmenes persistentes gestionados por Docker
volumes:
  mariadb_data:
    driver: local
  mariadb_audit_logs:
    driver: local
  storage_uploads:
    driver: local