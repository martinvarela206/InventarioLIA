version: '3.8'

services:
  # Contenedor 1: Aplicación Laravel (PHP + Apache + Vite assets)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventario-lia-app:latest
    container_name: laravel_prod
    restart: always
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    networks:
      - app_network

  # Contenedor 2: Base de Datos Relacional (MariaDB)
  db:
    image: mariadb:11.4
    container_name: mariadb_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_DATABASE:-inventario_lia}
      MYSQL_USER: ${DB_USERNAME:-inventario_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - mariadb_data:/var/lib/mysql
      - mariadb_audit_logs:/var/log/mysql
    command:
      - --plugin-load-add=server_audit
      - --server-audit=FORCE_PLUS_PERMANENT
      - --server-audit-logging=ON
      - --server-audit-events=CONNECT,QUERY_DML,QUERY_DDL
      - --server-audit-output-type=FILE
      - --server-audit-file-path=/var/log/mysql/audit.log
      - --server-audit-file-rotate-size=104857600
      - --server-audit-file-rotations=5
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  mariadb_audit_logs:
    driver: local
  storage_uploads:
    driver: local